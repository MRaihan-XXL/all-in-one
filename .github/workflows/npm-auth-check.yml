name: npm-auth-check

# Preflight for the release publish lane: prints npm whoami (USERNAME ONLY —
# never the token) using the NPM_TOKEN secret, so an invalid/unscoped/foreign
# token is diagnosed in seconds instead of surfacing as npm's misleading E404
# on publish. Dispatch manually: gh workflow run npm-auth-check.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm whoami (username only — token never printed)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

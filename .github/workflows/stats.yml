name: Stats auto-gen

# Regenerate the project's live numbers from a REAL suite run (never hand
# edited): README test lines, assets/aio-stats.svg, docs/stats.json.
# Weekly + on demand; commits only when the numbers actually moved.

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

# never let two stats runs push at each other
concurrency:
  group: stats-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate stats from a real run
        run: node scripts/stats.mjs --write
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "stats unchanged - nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md index.html assets/aio-stats.svg docs/stats.json OUTPUTS.md
            git commit -m "chore(stats): regenerate live numbers [skip ci]"
            # another pusher (eval/og/merge) may have landed while we ran the suite
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

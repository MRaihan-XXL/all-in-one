name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # zero runtime deps — no install step needed
      # ubuntu runs the suite once via the coverage step (no double run)
      - run: npm test
        if: matrix.os != 'ubuntu-latest'
      - name: Coverage (reported, not gated)
        if: matrix.os == 'ubuntu-latest'
        run: node --test --experimental-test-coverage "test/*.js"
      - run: node bin/aio.js --help

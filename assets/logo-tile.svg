<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="aio app tile">
  <!-- app tile: three streams converging into one node (all-in-one),
       dimensional treatment — lit from top-left, extruded silver streams -->
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2028"/>
      <stop offset="0.55" stop-color="#101418"/>
      <stop offset="1" stop-color="#0B0E12"/>
    </linearGradient>
    <linearGradient id="steelT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#D7DADF"/>
      <stop offset="1" stop-color="#9BA1AA"/>
    </linearGradient>
    <radialGradient id="orbT" cx="0.36" cy="0.30" r="0.92">
      <stop offset="0" stop-color="#FFCDB8"/>
      <stop offset="0.24" stop-color="#FF7E52"/>
      <stop offset="0.62" stop-color="#FF4A1C"/>
      <stop offset="1" stop-color="#A82A0C"/>
    </radialGradient>
    <radialGradient id="tileLight" cx="0.32" cy="0.24" r="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <g id="tk" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 32 L46 54 Q62 64 84 64"/>
      <path d="M14 64 H84"/>
      <path d="M18 96 L46 74 Q62 64 84 64"/>
    </g>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#tileBg)"/>
  <!-- inner bevel -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#2A3038" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="121" height="121" rx="25" fill="url(#tileLight)"/>

  <!-- extrusion toward the tile floor -->
  <g transform="translate(3 4)" stroke="#040609" stroke-width="11" opacity="0.9"><use href="#tk"/></g>
  <g transform="translate(1.5 2)" stroke="#5A6270" stroke-width="11"><use href="#tk"/></g>
  <g stroke="url(#steelT)" stroke-width="11"><use href="#tk"/></g>

  <!-- glossy node -->
  <circle cx="103" cy="64" r="9.5" fill="url(#orbT)"/>
  <circle cx="103" cy="64" r="9.5" fill="none" stroke="#7E2008" stroke-opacity="0.6" stroke-width="0.9"/>
  <ellipse cx="100.4" cy="60.6" rx="3.3" ry="2.1" fill="#FFFFFF" opacity="0.75" transform="rotate(-32 100.4 60.6)"/>
  <ellipse cx="104.6" cy="67.8" rx="4.2" ry="1.6" fill="#FFB69A" opacity="0.38" transform="rotate(-18 104.6 67.8)"/>
</svg>

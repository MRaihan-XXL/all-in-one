  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="aio disclosure card: every agent reply starts with the [aio] Using name-url-type-function link line — required first line, every time">
  <defs>
    <clipPath id="typeClip"><rect x="84" y="168" width="0" height="30">
      <animate attributeName="width" values="0;1000" dur="3.4s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect></clipPath>
    <style>
      .sans{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
      .eyebrow{font-size:11px;letter-spacing:2.6px;fill:#7C828C}
      .bezel{fill:none;stroke:#2A2F37;stroke-width:1}
      .core{fill:#101318;stroke:#171B21;stroke-width:1}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .fd{animation:fadeIn .8s cubic-bezier(.32,.72,0,1) both}
      .rv{transform-box:fill-box;transform-origin:0 50%;animation:rise .8s cubic-bezier(.32,.72,0,1) both}
      @media (prefers-reduced-motion:reduce){.fd,.rv{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="340" rx="20" fill="#0B0D10"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="19.5" fill="none" stroke="#21252C"/>

  <!-- corner ticks -->
  <g stroke="#343A43" stroke-width="1.5" fill="none" class="fd" style="animation-delay:1s">
    <path d="M18 34 V18 H34"/><path d="M1166 18 H1182 V34"/>
    <path d="M1182 306 V322 H1166"/><path d="M34 322 H18 V306"/>
  </g>

  <!-- header -->
  <text x="64" y="46" class="mono eyebrow">FR6 <tspan fill="#343A43">—</tspan> THE RULE EVERY AGENT OBEYS</text>
  <g class="fd" style="animation-delay:.6s">
    <rect x="984" y="28" width="152" height="26" rx="13" fill="none" stroke="#FF4A1C" stroke-opacity="0.45">
      <animate attributeName="stroke-opacity" values="0.45;0.15;0.45" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="1060" y="45.5" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1.6" fill="#FF4A1C">REQUIRED</text>
  </g>
  <line x1="64" y1="62" x2="1136" y2="62" stroke="#21252C" class="fd" style="animation-delay:.15s"/>

  <!-- terminal card (double bezel) -->
  <g class="rv" style="animation-delay:.3s">
    <rect class="bezel" x="64.5" y="96.5" width="1071" height="159" rx="14"/>
    <rect class="core" x="70" y="102" width="1060" height="148" rx="10"/>

    <!-- title bar -->
    <circle cx="90" cy="124" r="4" fill="#2A2F37"/>
    <circle cx="106" cy="124" r="4" fill="#2A2F37"/>
    <circle cx="122" cy="124" r="4" fill="#2A2F37"/>
    <text x="144" y="128" class="mono" font-size="11" letter-spacing="1.2" fill="#5A606A">AI AGENT · REPLY BEGINS WITH</text>
    <text x="1114" y="128" text-anchor="end" class="mono" font-size="10.5" letter-spacing="1.4" fill="#4A505A">FIRST LINE · EVERY TIME</text>
    <line x1="70" y1="140" x2="1130" y2="140" stroke="#1D2127"/>

    <!-- dim: the user prompt -->
    <text x="86" y="164" class="mono" font-size="12.5" fill="#4A505A">› convert this pdf to word for me</text>

    <!-- the disclosure line (typewriter reveal) -->
    <g clip-path="url(#typeClip)">
      <text x="86" y="194" class="mono" font-size="13.5" fill="#EDEBE6">[aio] Using <tspan fill="#FF4A1C" font-weight="700">[Stirling-PDF](https://github.com/Stirling-Tools/Stirling-PDF)</tspan> (repo) — HTML/CSS/JS to PDF converter</text>
    </g>
    <rect x="1089" y="180" width="9" height="17" fill="#FF4A1C">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.52;0.52;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>

    <!-- link underline sweep, after the reveal -->
    <rect x="193" y="202" width="0" height="2.5" rx="1.25" fill="#FF4A1C" class="fd" style="animation-delay:4.4s" opacity="0.8">
      <animate attributeName="width" values="0;552" dur=".7s" begin="4.4s" fill="freeze"/>
    </rect>

    <!-- anatomy row -->
    <g class="fd" style="animation-delay:4.6s">
      <text x="86" y="232" class="mono" font-size="10.5" letter-spacing="1.6" fill="#5A606A">NAME<tspan fill="#343A43"> ↗</tspan> URL<tspan fill="#343A43"> ↗</tspan> TYPE<tspan fill="#343A43"> ↗</tspan> ONE-LINE FUNCTION — LINKED, ATTRIBUTED, AUDITABLE
        <animate attributeName="fill" values="#5A606A;#FF4A1C;#5A606A" dur="6s" begin="5.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- CRT scanline sweep over the terminal -->
    <rect x="70" y="150" width="1060" height="2" fill="#FF4A1C" opacity="0.09">
      <animate attributeName="y" values="150;248;150" dur="7s" begin="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="opacity" values="0;0.09;0.09;0" keyTimes="0;0.06;0.94;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- footer micro -->
  <text x="64" y="286" class="mono fd" font-size="11" letter-spacing="1.6" fill="#4A505A" style="animation-delay:1.2s">THE SAME LINE IS WRITTEN INTO EVERY AGENT BLOCK + THE SHARED MANIFEST</text>
  <text x="1136" y="286" text-anchor="end" class="mono fd" font-size="11" letter-spacing="1.6" fill="#4A505A" style="animation-delay:1.2s">NO SLASH-COMMANDS · ENFORCED BY THE MODEL</text>
</svg>

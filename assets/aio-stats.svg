      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      .gw{animation:grow .9s cubic-bezier(.32,.72,0,1) both}
      .rv{transform-box:fill-box;transform-origin:50% 100%;animation:rise .75s cubic-bezier(.32,.72,0,1) both}
      .fd{animation:fadeIn .8s cubic-bezier(.32,.72,0,1) both}
      @media (prefers-reduced-motion:reduce){.gw,.rv,.fd{animation:none}}

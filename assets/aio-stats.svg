<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="aio live stats: 630M+ github repos (Octoverse 2025), 3M+ npm packages, 340K+ crates (measured 342,787), 6.8M+ skill files (measured 6,832,128), 0 bytes stored, 34/34 tests pass">
  <defs>
    <clipPath id="stripClip"><rect x="64" y="76" width="1072" height="150" rx="12"/></clipPath>
    <linearGradient id="stripSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A1C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4A1C" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#FF4A1C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .disp{font-family:ui-sans-serif,system-ui,"Segoe UI Variable Display","Segoe UI",sans-serif;font-weight:800;fill:#EDEBE6}
      .mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
      .eyebrow{font-size:11px;letter-spacing:2.6px;fill:#7C828C}
      .lbl{font-size:10.5px;letter-spacing:1.8px;fill:#7C828C}
      .micro{font-size:10.5px;letter-spacing:1.4px;fill:#4A505A}
      .acc{fill:#FF4A1C}
      .g{transform-box:fill-box;transform-origin:0 50%}
      .c{transform-box:fill-box;transform-origin:50% 50%}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      .gw{animation:grow .9s cubic-bezier(.32,.72,0,1) both}
      .rv{transform-box:fill-box;transform-origin:50% 100%;animation:rise .75s cubic-bezier(.32,.72,0,1) both}
      .fd{animation:fadeIn .8s cubic-bezier(.32,.72,0,1) both}
      @media (prefers-reduced-motion:reduce){.gw,.rv,.fd{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="#0B0D10"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#21252C"/>

  <!-- header -->
    <text x="64" y="42" class="mono eyebrow">VERIFIED <tspan fill="#343A43">—</tspan> LIVE CORPUS, FLOORS MEASURED 2026-09-30</text>
  <g class="fd" style="animation-delay:.6s">
    <rect x="990.5" y="24.5" width="146" height="26" rx="13" fill="none" stroke="#FF4A1C" stroke-opacity="0.45">
      <animate attributeName="stroke-opacity" values="0.45;0.15;0.45" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="1063" y="41.5" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1.6" fill="#FF4A1C">100% LIVE</text>
  </g>
  <line x1="64" y1="58" x2="1136" y2="58" stroke="#21252C" class="gw" style="animation-delay:.15s"/>

  <!-- strip -->
  <rect x="64.5" y="76.5" width="1071" height="149" rx="12" fill="#0E1116" stroke="#1D2127" class="fd" style="animation-delay:.35s"/>
  <!-- sheen sweep -->
  <g clip-path="url(#stripClip)">
    <rect x="64" y="70" width="1072" height="36" fill="url(#stripSheen)">
      <animate attributeName="y" values="70;226;70" dur="5.8s" begin="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
  </g>

  <!-- vertical dividers -->
  <g stroke="#1A1E24" class="fd" style="animation-delay:.5s">
    <line x1="232" y1="96" x2="232" y2="206"/>
    <line x1="410" y1="96" x2="410" y2="206"/>
    <line x1="588" y1="96" x2="588" y2="206"/>
    <line x1="766" y1="96" x2="766" y2="206"/>
    <line x1="944" y1="96" x2="944" y2="206"/>
  </g>

  <!-- cell 1: github repos -->
  <g>
    <rect x="88" y="96" width="120" height="3" rx="1.5" fill="#FF4A1C" class="gw" style="animation-delay:.4s"/>
    <rect x="88" y="96" width="16" height="3" rx="1.5" fill="#EDEBE6">
      <animate attributeName="x" values="88;192;88" dur="3.4s" begin="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
    <text x="88" y="156" class="disp rv" font-size="40" letter-spacing="-1.5" style="animation-delay:.5s">630M+</text>
    <text x="88" y="186" class="mono lbl rv" style="animation-delay:.58s">GITHUB REPOS</text>
    <text x="88" y="208" class="mono micro rv" style="animation-delay:.66s">octoverse 2025</text>
  </g>

  <!-- cell 2: npm packages -->
  <g>
    <rect x="266" y="96" width="120" height="3" rx="1.5" fill="#FF4A1C" class="gw" style="animation-delay:.52s"/>
    <rect x="266" y="96" width="16" height="3" rx="1.5" fill="#EDEBE6">
      <animate attributeName="x" values="266;370;266" dur="3.4s" begin="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
    <text x="266" y="156" class="disp rv" font-size="40" letter-spacing="-1.5" style="animation-delay:.62s">3M+</text>
    <text x="266" y="186" class="mono lbl rv" style="animation-delay:.7s">NPM PACKAGES</text>
    <text x="266" y="208" class="mono micro rv" style="animation-delay:.78s">registry search api</text>
  </g>

  <!-- cell 3: crates -->
  <g>
    <rect x="444" y="96" width="120" height="3" rx="1.5" fill="#FF4A1C" class="gw" style="animation-delay:.64s"/>
    <rect x="444" y="96" width="16" height="3" rx="1.5" fill="#EDEBE6">
      <animate attributeName="x" values="444;548;444" dur="3.4s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
    <text x="444" y="156" class="disp rv" font-size="40" letter-spacing="-1.5" style="animation-delay:.74s">340K+</text>
    <text x="444" y="186" class="mono lbl rv" style="animation-delay:.82s">CRATES</text>
    <text x="444" y="208" class="mono micro rv" style="animation-delay:.9s">api total 342,787</text>
  </g>

  <!-- cell 4: skill files -->
  <g>
    <rect x="622" y="96" width="120" height="3" rx="1.5" fill="#FF4A1C" class="gw" style="animation-delay:.76s"/>
    <rect x="622" y="96" width="16" height="3" rx="1.5" fill="#EDEBE6">
      <animate attributeName="x" values="622;726;622" dur="3.4s" begin="2.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
    <text x="622" y="156" class="disp rv" font-size="40" letter-spacing="-1.5" style="animation-delay:.86s">6.8M+</text>
    <text x="622" y="186" class="mono lbl rv" style="animation-delay:.94s">SKILL FILES</text>
    <text x="622" y="208" class="mono micro rv" style="animation-delay:1.02s">counted 6,832,128</text>
  </g>

  <!-- cell 5: zero bytes (accent) -->
  <g>
    <rect x="800" y="96" width="120" height="3" rx="1.5" fill="#FF4A1C" class="gw" style="animation-delay:.88s"/>
    <rect x="800" y="96" width="16" height="3" rx="1.5" fill="#EDEBE6">
      <animate attributeName="x" values="800;904;800" dur="3.4s" begin="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
    <text x="800" y="156" class="disp acc rv" font-size="40" letter-spacing="-1.5" style="animation-delay:.98s">0</text>
    <circle cx="836" cy="146" r="4" fill="#FF4A1C">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="800" y="186" class="mono lbl rv" style="animation-delay:1.06s">BYTES STORED</text>
    <text x="800" y="208" class="mono micro rv" style="animation-delay:1.14s">no db · no clones</text>
  </g>

  <!-- cell 6: tests -->
  <g>
    <rect x="978" y="96" width="120" height="3" rx="1.5" fill="#FF4A1C" class="gw" style="animation-delay:1s"/>
    <rect x="978" y="96" width="16" height="3" rx="1.5" fill="#EDEBE6">
      <animate attributeName="x" values="978;1082;978" dur="3.4s" begin="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
    <text x="978" y="156" class="disp rv" font-size="40" letter-spacing="-1.5" style="animation-delay:1.1s">34/34</text>
    <text x="978" y="186" class="mono lbl rv" style="animation-delay:1.18s">TESTS PASS</text>
    <text x="978" y="208" class="mono micro rv" style="animation-delay:1.26s">node --test · mocked net</text>
  </g>

  <!-- footer micro -->
  <text x="64" y="256" class="mono micro fd" style="animation-delay:1.3s">SOURCES QUERIED LIVE AT RUNTIME — AIO NEVER WRITES A DATABASE</text>
  <text x="1136" y="256" text-anchor="end" class="mono micro fd" style="animation-delay:1.3s">ZERO-CLONE · BORROW TEMPORARY ONLY</text>
</svg>

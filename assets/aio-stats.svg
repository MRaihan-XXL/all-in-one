  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="aio live stats: 630M+ github repos (Octoverse 2025), 3M+ npm packages, 340K+ crates (measured 342,787), 6.8M+ skill files (measured 6,832,128), no search storage, 79/79 tests pass">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-label="aio verified: 231 repositories, 23 tools, 45 sites, 67 skills, 30 of 30 tests pass, green CI on 3 OS">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4A1C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4A1C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF4A1C" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sweepClip"><rect x="64" y="70" width="1068" height="94" rx="8"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
      .disp{font-family:ui-sans-serif,system-ui,"Segoe UI Variable Display","Segoe UI",sans-serif;font-weight:750;fill:#EDEBE6;font-size:42px;letter-spacing:-1.5px}
      .lab{font-size:10px;letter-spacing:2px;fill:#7C828C}
      .eyebrow{font-size:11px;letter-spacing:2.6px;fill:#7C828C}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .r{transform-box:fill-box;transform-origin:0 50%;animation:rise .8s cubic-bezier(.32,.72,0,1) both}
      .f{animation:fadeIn .7s cubic-bezier(.32,.72,0,1) both}
      .g{transform-box:fill-box;transform-origin:0 50%;animation:grow .9s cubic-bezier(.32,.72,0,1) both}
      @media (prefers-reduced-motion:reduce){.r,.f,.g{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="190" rx="20" fill="#0B0D10"/>
  <rect x="0.5" y="0.5" width="1199" height="189" rx="19.5" fill="none" stroke="#21252C"/>

  <text x="64" y="42" class="mono eyebrow">VERIFIED <tspan fill="#343A43">—</tspan> 2026-09-30</text>
  <text x="1136" y="42" text-anchor="end" class="mono" font-size="11" letter-spacing="2.6" fill="#FF4A1C">SHIP IT</text>
  <line x1="64" y1="56" x2="1136" y2="56" stroke="#21252C" class="g" style="animation-delay:.1s"/>

  <!-- subtle accent sweep -->
  <g clip-path="url(#sweepClip)">
    <rect y="70" width="140" height="94" fill="url(#sweep)">
      <animate attributeName="x" values="64;1132;64" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </rect>
  </g>

  <!-- cell dividers -->
  <g stroke="#171B21" class="f" style="animation-delay:.9s">
    <line x1="234" y1="74" x2="234" y2="160"/>
    <line x1="412" y1="74" x2="412" y2="160"/>
    <line x1="590" y1="74" x2="590" y2="160"/>
    <line x1="768" y1="74" x2="768" y2="160"/>
    <line x1="946" y1="74" x2="946" y2="160"/>
  </g>

  <!-- cells -->
  <g style="animation-delay:.25s" class="r">
    <text x="64" y="122" class="disp">231</text>
    <text x="64" y="150" class="mono lab">REPOSITORIES</text>
    <rect x="64" y="158" width="56" height="2.5" rx="1.25" fill="#FF4A1C" class="g" style="animation-delay:.55s"/>
  </g>
  <g style="animation-delay:.37s" class="r">
    <text x="242" y="122" class="disp">23</text>
    <text x="242" y="150" class="mono lab">TOOLS</text>
    <rect x="242" y="158" width="44" height="2.5" rx="1.25" fill="#FF4A1C" class="g" style="animation-delay:.67s"/>
  </g>
  <g style="animation-delay:.49s" class="r">
    <text x="420" y="122" class="disp">45</text>
    <text x="420" y="150" class="mono lab">SITES</text>
    <rect x="420" y="158" width="44" height="2.5" rx="1.25" fill="#FF4A1C" class="g" style="animation-delay:.79s"/>
  </g>
  <g style="animation-delay:.61s" class="r">
    <text x="598" y="122" class="disp">67</text>
    <text x="598" y="150" class="mono lab">SKILLS</text>
    <rect x="598" y="158" width="44" height="2.5" rx="1.25" fill="#FF4A1C" class="g" style="animation-delay:.91s"/>
  </g>
  <g style="animation-delay:.73s" class="r">
    <text x="776" y="122" class="disp">30/30</text>
    <text x="776" y="150" class="mono lab">TESTS PASS</text>
    <rect x="776" y="158" width="76" height="2.5" rx="1.25" fill="#FF4A1C" class="g" style="animation-delay:1.03s"/>
  </g>
  <g style="animation-delay:.85s" class="r">
    <text x="954" y="122" class="disp">3/3</text>
    <text x="954" y="150" class="mono lab">OS CI GREEN</text>
    <rect x="954" y="158" width="60" height="2.5" rx="1.25" fill="#FF4A1C" class="g" style="animation-delay:1.15s"/>
  </g>
</svg>

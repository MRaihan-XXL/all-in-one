  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="aio — all-in-one: live search across github (630M+ repos), npm and crates for AI agents, no search storage — results printed, never saved">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#171B21"/>
    </pattern>
    <clipPath id="wordClip"><rect x="56" y="120" width="330" height="180"/></clipPath>
    <clipPath id="panelClip"><rect x="627" y="103" width="502" height="286" rx="12"/></clipPath>
    <linearGradient id="askSheen2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A1C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4A1C" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FF4A1C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#FF4A1C" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF4A1C" stop-opacity="0"/>
    </radialGradient>
    <style>
      .disp{font-family:ui-sans-serif,system-ui,"Segoe UI Variable Display","Segoe UI",sans-serif;font-weight:800;fill:#EDEBE6}
      .sans{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
      .eyebrow{font-size:11px;letter-spacing:2.6px;fill:#7C828C}
      .muted{fill:#7C828C}
      .dim{fill:#4A505A}
      .txt{fill:#C9CDD4}
      .acc{fill:#FF4A1C}
      .hair{stroke:#21252C;stroke-width:1}
      .hair2{stroke:#171B21;stroke-width:1}
      @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      @keyframes riseSm{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      .g{transform-box:fill-box;transform-origin:0 50%}
      .c{transform-box:fill-box;transform-origin:50% 50%}
      .r{transform-box:fill-box;transform-origin:50% 50%;animation:rise .9s cubic-bezier(.32,.72,0,1) both}
      .rs{transform-box:fill-box;transform-origin:0 50%;animation:riseSm .7s cubic-bezier(.32,.72,0,1) both}
      .gw{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.32,.72,0,1) both}
      .pp{animation:pop .8s cubic-bezier(.34,1.4,.5,1) both}
      .fd{animation:fadeIn .8s cubic-bezier(.32,.72,0,1) both}
      .lg>circle,.lg>path{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.5s cubic-bezier(.32,.72,0,1) .5s forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion:reduce){.r,.rs,.gw,.pp,.fd{animation:none}.lg>circle,.lg>path{animation:none;stroke-dashoffset:0}}
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="520" rx="20" fill="#0B0D10"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="19.5" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="19.5" fill="none" stroke="#21252C"/>

  <!-- corner ticks -->
  <g stroke="#343A43" stroke-width="1.5" fill="none" class="fd" style="animation-delay:.9s">
    <path d="M18 34 V18 H34"/><path d="M1166 18 H1182 V34"/>
    <path d="M1182 486 V502 H1166"/><path d="M34 502 H18 V486"/>
  </g>

  <!-- top bar -->
  <circle cx="48" cy="42" r="4" fill="#FF4A1C" class="fd" style="animation-delay:.5s">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="46" class="mono eyebrow">ALL-IN-ONE<tspan fill="#343A43">  //  </tspan>LIVE AUTO-CONTEXT CLI</text>
  <g class="fd" style="animation-delay:.7s">
    <rect x="1064" y="28" width="72" height="26" rx="13" fill="none" stroke="#FF4A1C" stroke-opacity="0.45"/>
    <text x="1100" y="45" text-anchor="middle" class="mono" font-size="11" fill="#FF4A1C">v1.4.1</text>
  </g>
  <line x1="64" y1="62" x2="1136" y2="62" class="hair gw" style="animation-delay:.15s"/>

  <!-- vertical editorial rule -->
  <line x1="590" y1="96" x2="590" y2="396" stroke="#171B21" class="fd" style="animation-delay:.45s"/>

  <!-- ============ LEFT: wordmark (constructed vector letterforms — no fonts) ============ -->
  <g clip-path="url(#wordClip)">
    <g transform="translate(48.8 137.9) scale(1.265)">
      <g class="r" style="animation-delay:.35s">
        <g class="lg" fill="none" stroke="#EDEBE6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <circle pathLength="100" cx="44" cy="70" r="26"/>
          <path pathLength="100" d="M70 44 V100"/>
          <path pathLength="100" d="M110 44 V100"/>
          <circle pathLength="100" cx="164" cy="70" r="26"/>
        </g>
        <circle cx="110" cy="24" r="8" fill="#FF4A1C"/>
      </g>
    </g>
  </g>
  <!-- brand dot with entrance + breathing halo -->
  <g class="pp" style="animation-delay:.75s">
    <circle cx="336" cy="252" r="34" fill="url(#dotHalo)">
      <animate attributeName="r" values="30;40;30" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="336" cy="252" r="15" fill="#FF4A1C"/>
    <circle cx="336" cy="252" r="15" fill="none" stroke="#FF4A1C" stroke-width="1.5">
      <animate attributeName="r" values="15;34" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="64" y="300" width="56" height="3" rx="1.5" fill="#FF4A1C" class="gw" style="animation-delay:.65s">
    <animate attributeName="opacity" values="1;0.45;1" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="340" class="sans txt r" font-size="21" font-weight="500" style="animation-delay:.6s">the everything connector for AI agents</text>
  <text x="64" y="370" class="mono dim rs" font-size="12.5" letter-spacing="2" style="animation-delay:.72s">live ask  ·  borrow  ·  doctor  ·  evolve</text>

  <!-- ============ RIGHT: live panel (double bezel) ============ -->
  <g class="r" style="animation-delay:.45s">
    <rect x="620.5" y="96.5" width="515" height="299" rx="17" fill="none" stroke="#21252C"/>
    <rect x="627" y="103" width="502" height="286" rx="12" fill="#101318" stroke="#171B21"/>
    <!-- live sheen sweep -->
    <g clip-path="url(#panelClip)">
      <rect x="627" y="96" width="502" height="42" fill="url(#askSheen2)">
        <animate attributeName="y" values="96;394;96" dur="5.4s" begin="2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </rect>
    </g>
    <text x="647" y="136" class="mono" font-size="10.5" letter-spacing="2.4" fill="#7C828C">CATALOG</text>
    <circle cx="712" cy="132" r="3.5" fill="#FF4A1C">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="712" cy="132" r="3.5" fill="none" stroke="#FF4A1C">
      <animate attributeName="r" values="3.5;11" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1109" y="136" text-anchor="end" class="mono" font-size="10.5" letter-spacing="2.4" fill="#FF4A1C">LIVE — NO SEARCH STORAGE</text>
    <line x1="647" y1="150" x2="1109" y2="150" stroke="#1D2127"/>

    <!-- row 1: repositories 231 -->
    <g class="rs" style="animation-delay:.62s">
      <text x="647" y="192" class="mono" font-size="13" fill="#9AA0A8">github repos</text>
      <text x="1109" y="196" text-anchor="end" class="disp" font-size="34" letter-spacing="-1">630M+
        <animate attributeName="opacity" values="1;0.68;1" dur="5s" begin="2.2s" repeatCount="indefinite"/>
      </text>
      <line x1="647" y1="210" x2="1109" y2="210" stroke="#1A1E24"/>
      <rect x="647" y="208.5" width="30" height="3" fill="#FF4A1C" opacity="0.85">
        <animate attributeName="x" values="647;1079;647" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </rect>
    </g>
    <!-- row 2: tools 23 -->
    <g class="rs" style="animation-delay:.74s">
      <text x="647" y="252" class="mono" font-size="13" fill="#9AA0A8">npm packages</text>
      <text x="1109" y="256" text-anchor="end" class="disp" font-size="34" letter-spacing="-1">3M+
        <animate attributeName="opacity" values="1;0.68;1" dur="5s" begin="2.65s" repeatCount="indefinite"/>
      </text>
      <line x1="647" y1="270" x2="1109" y2="270" stroke="#1A1E24"/>
      <rect x="647" y="268.5" width="30" height="3" fill="#FF4A1C" opacity="0.85">
        <animate attributeName="x" values="647;1079;647" dur="7s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </rect>
    </g>
    <!-- row 3: sites 45 -->
    <g class="rs" style="animation-delay:.86s">
      <text x="647" y="312" class="mono" font-size="13" fill="#9AA0A8">crates</text>
      <text x="1109" y="316" text-anchor="end" class="disp" font-size="34" letter-spacing="-1">340K+
        <animate attributeName="opacity" values="1;0.68;1" dur="5s" begin="3.1s" repeatCount="indefinite"/>
      </text>
      <line x1="647" y1="330" x2="1109" y2="330" stroke="#1A1E24"/>
      <rect x="647" y="328.5" width="30" height="3" fill="#FF4A1C" opacity="0.85">
        <animate attributeName="x" values="647;1079;647" dur="7s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </rect>
    </g>
    <!-- row 4: skills 67 -->
    <g class="rs" style="animation-delay:.98s">
      <text x="647" y="372" class="mono" font-size="13" fill="#9AA0A8">skill files</text>
      <text x="1109" y="376" text-anchor="end" class="disp" font-size="34" letter-spacing="-1">6.8M+
        <animate attributeName="opacity" values="1;0.68;1" dur="5s" begin="3.55s" repeatCount="indefinite"/>
      </text>
      <line x1="647" y1="390" x2="1109" y2="390" stroke="#1A1E24"/>
      <rect x="647" y="388.5" width="30" height="3" fill="#FF4A1C" opacity="0.85">
        <animate attributeName="x" values="647;1079;647" dur="7s" begin="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </rect>
    </g>
  </g>

  <!-- ============ BOTTOM: flow ticker ============ -->
  <g class="r" style="animation-delay:1.05s">
    <rect x="64.5" y="416.5" width="1071" height="67" rx="15" fill="none" stroke="#21252C"/>
    <rect x="70" y="422" width="1060" height="56" rx="11" fill="#101318" stroke="#171B21"/>

    <text x="92" y="456" class="mono" font-size="13" font-weight="700" fill="#EDEBE6">$ prompt</text>
    <text x="168" y="456" class="mono" font-size="13" fill="#3A4049">→</text>
    <text x="196" y="456" class="mono" font-size="13" font-weight="700" fill="#EDEBE6">aio ask</text>
    <text x="265" y="456" class="mono" font-size="13" fill="#3A4049">→</text>
    <text x="293" y="456" class="mono" font-size="13" font-weight="700" fill="#EDEBE6">use</text>
    <text x="330" y="456" class="mono" font-size="13" fill="#3A4049">→</text>
    <text x="358" y="456" class="mono" font-size="13" font-weight="700" fill="#EDEBE6">report ↗</text>
    <text x="434" y="456" class="mono" font-size="13" fill="#3A4049">→</text>
    <text x="462" y="456" class="mono" font-size="13" font-weight="700" fill="#EDEBE6">clean</text>
    <text x="566" y="456" class="mono" font-size="11" letter-spacing="1" fill="#4A505A">LIVE: github ∥ npm ∥ crates</text>

    <!-- sliding accent underline -->
    <rect y="466" height="2.5" width="64" rx="1.25" fill="#FF4A1C">
      <animate attributeName="x" values="90;194;291;356;460;90" keyTimes="0;0.18;0.36;0.54;0.72;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="width" values="64;59;27;66;43;64" keyTimes="0;0.18;0.36;0.54;0.72;1" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>

    <!-- cursor + promise -->
    <rect x="514" y="444" width="9" height="17" fill="#FF4A1C">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.52;0.52;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="1112" y="456" text-anchor="end" class="mono" font-size="11" letter-spacing="1.4" fill="#5A606A">NO SEARCH HISTORY STORED</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="aio live pipeline: prompt, aio ask searching github, npm and crates in parallel (web lane dimmed — URL hands off to your own search), ranked results, ephemeral use, report with links, clean, repeat">
  <defs>
    <clipPath id="askClip"><rect x="350" y="102" width="288" height="164" rx="10"/></clipPath>
    <linearGradient id="askSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A1C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4A1C" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF4A1C" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans{font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
      .idx{font-size:10.5px;letter-spacing:1.6px;fill:#FF4A1C;font-weight:600}
      .t{font-size:15.5px;font-weight:650;fill:#EDEBE6}
      .s{font-size:11.5px;fill:#7C828C}
      .lane{font-size:10px;letter-spacing:1.4px;fill:#9AA0A8;font-weight:600}
      .chip{font-size:9.5px;letter-spacing:1.1px;fill:#9AA0A8}
      .eyebrow{font-size:11px;letter-spacing:2.6px;fill:#7C828C}
      .bezel{fill:none;stroke:#2A2F37;stroke-width:1}
      .core{fill:#101318;stroke:#171B21;stroke-width:1}
      .wire{fill:none;stroke:#2E333B;stroke-width:1.5;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.2s cubic-bezier(.32,.72,0,1) both}
      .wireL{fill:none;stroke:#2E333B;stroke-width:1.5;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.5s cubic-bezier(.32,.72,0,1) both}
      .chev{fill:none;stroke:#5A606A;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .pulse{fill:none;stroke:#FF4A1C;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:5 95;stroke-dashoffset:100}
      .march{fill:none;stroke:#FF4A1C;stroke-dasharray:4 3;animation:march 1.4s linear infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes march{to{stroke-dashoffset:-14}}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
      @keyframes hl{0%{stroke:#2A2F37}2%{stroke:#FF4A1C}11%{stroke:#2A2F37}100%{stroke:#2A2F37}}
      @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
      @keyframes flick{0%,100%{opacity:1}44%{opacity:.55}47%{opacity:1}76%{opacity:.7}78%{opacity:1}}
      .card{transform-box:fill-box;transform-origin:0 50%;animation:rise .85s cubic-bezier(.32,.72,0,1) both}
      .cardout{animation:hl 8s cubic-bezier(.45,0,.55,1) infinite}
      .gw{transform-box:fill-box;transform-origin:0 50%;animation:grow .8s cubic-bezier(.32,.72,0,1) both}
      .ch{animation:fadeIn .45s ease both}
      .fd{animation:fadeIn .7s cubic-bezier(.32,.72,0,1) both}
      /* kinetic badge: fades in, then a slow heartbeat (beat beats to the 8s master) */
      .kb{transform-box:fill-box;transform-origin:50% 50%;animation:fadeIn .7s cubic-bezier(.32,.72,0,1) .7s both, beat 3.2s cubic-bezier(.45,0,.55,1) 2s infinite}
      /* kinetic lane: live lane labels flicker softly like a signal lock */
      .kf{animation:flick 6s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){.card,.ch,.fd,.march,.gw{animation:none}.wire,.wireL{stroke-dashoffset:0;animation:none}.cardout{animation:none}.kb{animation:none}.kf{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="620" rx="20" fill="#0B0D10"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="19.5" fill="none" stroke="#21252C"/>

  <!-- corner ticks -->
  <g stroke="#343A43" stroke-width="1.5" fill="none" class="fd" style="animation-delay:1s">
    <path d="M18 34 V18 H34"/><path d="M1166 18 H1182 V34"/>
    <path d="M1182 586 V602 H1166"/><path d="M34 602 H18 V586"/>
  </g>

  <!-- header -->
  <text x="64" y="46" class="mono eyebrow">LIVE PIPELINE <tspan fill="#343A43">—</tspan> PROMPT → ASK → USE → REPORT → CLEAN <tspan fill="#FF4A1C" font-weight="400">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.06s" repeatCount="indefinite"/></tspan></text>
  <rect x="980" y="28" width="156" height="26" rx="13" fill="none" stroke="#FF4A1C" stroke-opacity="0.45" class="fd" style="animation-delay:.7s">
    <animate attributeName="stroke-opacity" values="0.45;0.15;0.45" keyTimes="0;0.5;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
  <text x="1058" y="45" text-anchor="middle" class="mono kb" font-size="10" letter-spacing="1.4" fill="#FF4A1C">NO SEARCH STORAGE</text>
  <line x1="64" y1="62" x2="1136" y2="62" stroke="#21252C" class="fd" style="animation-delay:.15s"/>

  <!-- ===== wires ===== -->
  <g>
    <path class="wire" style="animation-delay:.55s" d="M284 180 H344"/>
    <path class="wire" style="animation-delay:.68s" d="M644 184 H744"/>
    <path class="wire" style="animation-delay:.8s"  d="M864 258 V330"/>
    <path class="wire" style="animation-delay:.92s" d="M804 430 V444 Q804 452 796 452 H612 Q604 452 604 460 V470"/>
    <path class="wire" style="animation-delay:1.04s" d="M644 518 H744"/>
    <path class="wireL" style="animation-delay:1.16s" d="M864 558 V586 Q864 600 848 600 H190 Q174 600 174 586 V230"/>
  </g>

  <!-- energy comets — ONE synchronized 8s master loop: the pulse travels the
       pipeline step by step (01→02→03→04→05→06→loop) instead of six
       independent infinite timers competing for attention (excess fix) -->
  <g>
    <path class="pulse" pathLength="100" d="M284 180 H344">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.07;0.16;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="pulse" pathLength="100" d="M644 184 H744">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.18;0.27;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="pulse" pathLength="100" d="M864 258 V330">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.30;0.39;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="pulse" pathLength="100" d="M804 430 V444 Q804 452 796 452 H612 Q604 452 604 460 V470">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.44;0.56;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="pulse" pathLength="100" d="M644 518 H744">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.60;0.68;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="pulse" pathLength="100" stroke-opacity="0.4" d="M864 558 V586 Q864 600 848 600 H190 Q174 600 174 586 V230">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.72;0.98;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- chevrons — each nudges forward inside ITS wire's comet window (8s master) -->
  <g class="ch" style="animation-delay:1.25s">
    <path class="chev" d="M332 174 L338 180 L332 186">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;3 0;0 0;0 0" keyTimes="0;0.07;0.115;0.16;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="chev" d="M732 178 L738 184 L732 190">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;3 0;0 0;0 0" keyTimes="0;0.18;0.225;0.27;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="chev" d="M858 318 L864 324 L870 318">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 3;0 0;0 0" keyTimes="0;0.30;0.345;0.39;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="chev" d="M598 464 L604 470 L610 464">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-3 0;0 0;0 0" keyTimes="0;0.44;0.50;0.56;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="chev" d="M732 512 L738 518 L732 524">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;3 0;0 0;0 0" keyTimes="0;0.60;0.64;0.68;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path class="chev" d="M168 242 L174 236 L180 242">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -3;0 0;0 0" keyTimes="0;0.72;0.79;0.86;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="470" y="592" text-anchor="middle" class="mono fd" font-size="10.5" letter-spacing="1.6" fill="#4A505A" style="animation-delay:1.7s">THE LOOP CONTINUES — NEXT PROMPT
    <animate attributeName="fill" values="#4A505A;#4A505A;#FF4A1C;#FF4A1C;#4A505A" keyTimes="0;0.9;0.94;0.985;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
  </text>

  <!-- ===== 01 user prompt ===== -->
  <g class="card" style="animation-delay:.15s">
    <rect class="bezel cardout" x="64.5" y="130.5" width="219" height="99" rx="14" style="animation-delay:1.4s"/>
    <rect class="core" x="70" y="136" width="208" height="88" rx="10"/>
    <text x="86" y="160" class="mono idx">01</text>
    <text x="86" y="188" class="sans t">User prompt</text>
    <text x="86" y="212" class="sans s">“I need an awesome X”</text>
    <rect x="242" y="200" width="8" height="14" fill="#FF4A1C">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.52;0.52;1" dur="1.06s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===== 02 aio ask — LIVE (parallel lanes) ===== -->
  <g class="card" style="animation-delay:.3s">
    <rect class="bezel cardout" x="344.5" y="96.5" width="299" height="175" rx="14" style="animation-delay:2.52s"/>
    <rect class="core" x="350" y="102" width="288" height="164" rx="10"/>
    <text x="366" y="126" class="mono idx">02</text>
    <text x="366" y="152" class="sans t">aio ask</text>
    <rect x="467.5" y="112.5" width="167" height="19" rx="9.5" fill="none" stroke="#FF4A1C" stroke-opacity="0.4"/>
    <text x="478" y="126" class="mono kf" font-size="9.5" letter-spacing="1.1" fill="#FF4A1C">LIVE · ADAPTIVE · ≤4s</text>

    <!-- sheen sweep — parked above/below the clip, sweeps once per 8s master
         loop during card-02's live window (synced with the comets) -->
    <g clip-path="url(#askClip)">
      <rect x="350" y="96" width="288" height="34" fill="url(#askSheen)">
        <animate attributeName="y" values="60;60;270;270" keyTimes="0;0.16;0.30;1" dur="8s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0 0 0 0"/>
      </rect>
    </g>

    <!-- lane: github -->
    <g>
      <circle cx="370" cy="172" r="3" fill="#FF4A1C">
        <animate attributeName="opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.17;0.27;0.42;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="382" y="176" class="mono lane kf">GITHUB</text>
      <line x1="452" y1="172" x2="626" y2="172" stroke="#1D2127" stroke-width="2"/>
      <rect x="452" y="170.5" width="24" height="3" rx="1.5" fill="#FF4A1C">
        <animate attributeName="x" values="452;452;602;602;452;452" keyTimes="0;0.16;0.34;0.40;0.46;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- lane: npm -->
    <g>
      <circle cx="370" cy="196" r="3" fill="#FF4A1C">
        <animate attributeName="opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.21;0.31;0.46;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="382" y="200" class="mono lane kf">NPM</text>
      <line x1="452" y1="196" x2="626" y2="196" stroke="#1D2127" stroke-width="2"/>
      <rect x="452" y="194.5" width="24" height="3" rx="1.5" fill="#FF4A1C">
        <animate attributeName="x" values="452;452;602;602;452;452" keyTimes="0;0.20;0.38;0.44;0.50;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- lane: crates -->
    <g>
      <circle cx="370" cy="220" r="3" fill="#FF4A1C">
        <animate attributeName="opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.25;0.35;0.50;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="382" y="224" class="mono lane kf">CRATES</text>
      <line x1="452" y1="220" x2="626" y2="220" stroke="#1D2127" stroke-width="2"/>
      <rect x="452" y="218.5" width="24" height="3" rx="1.5" fill="#FF4A1C">
        <animate attributeName="x" values="452;452;602;602;452;452" keyTimes="0;0.24;0.42;0.48;0.54;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- lane: web → your search (dimmed: URL hand-off, not fetched by ask) -->
    <g>
      <circle cx="370" cy="244" r="3" fill="none" stroke="#5A606A">
        <animate attributeName="opacity" values="1;1;0.35;1;1" keyTimes="0;0.29;0.39;0.54;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="382" y="248" class="mono lane" fill="#5A606A">WEB → YOUR SEARCH</text>
      <line x1="512" y1="244" x2="626" y2="244" stroke="#1D2127" stroke-width="2" stroke-dasharray="3 5"/>
      <rect x="512" y="242.5" width="24" height="3" rx="1.5" fill="none" stroke="#FF4A1C" stroke-opacity="0.7">
        <animate attributeName="x" values="512;512;602;602;512;512" keyTimes="0;0.28;0.46;0.52;0.58;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ===== 03 ranked results ===== -->
  <g class="card" style="animation-delay:.45s">
    <rect class="bezel cardout" x="744.5" y="110.5" width="239" height="147" rx="14" style="animation-delay:3.4s"/>
    <rect class="core" x="750" y="116" width="228" height="136" rx="10"/>
    <text x="766" y="140" class="mono idx">03</text>
    <text x="766" y="166" class="sans t">top-8 + diversity</text>
    <g class="fd" style="animation-delay:1.1s">
      <circle cx="770" cy="188" r="2.5" fill="#FF4A1C"/>
      <text x="782" y="192" class="mono" font-size="10" fill="#9AA0A8">github + npm + crates merged</text>
      <rect x="782" y="197" width="146" height="2" rx="1" fill="#FF4A1C" opacity="0.75" class="gw" style="animation-delay:1.25s"/>
      <circle cx="770" cy="210" r="2.5" fill="#FF4A1C"/>
      <text x="782" y="214" class="mono" font-size="10" fill="#9AA0A8">BM25 rank · ≥2 rows/source</text>
      <rect x="782" y="219" width="118" height="2" rx="1" fill="#FF4A1C" opacity="0.55" class="gw" style="animation-delay:1.45s"/>
      <circle cx="770" cy="232" r="2.5" fill="#FF4A1C"/>
      <text x="782" y="236" class="mono" font-size="10" fill="#9AA0A8">qwen3 rerank (optional · ≤3.5s)</text>
      <rect x="782" y="241" width="92" height="2" rx="1" fill="#FF4A1C" opacity="0.4" class="gw" style="animation-delay:1.65s"/>
    </g>
  </g>

  <!-- ===== 04 ephemeral use ===== -->
  <g class="card" style="animation-delay:.6s">
    <rect class="bezel cardout" x="744.5" y="330.5" width="391" height="99" rx="14" style="animation-delay:4.36s"/>
    <rect class="core" x="750" y="336" width="380" height="88" rx="10"/>
    <text x="766" y="360" class="mono idx">04</text>
    <text x="766" y="388" class="sans t">use ephemerally</text>
    <text x="766" y="410" class="sans s">npx · uvx · copy — ephemeral, no permanent install</text>
    <rect class="march" x="1002.5" y="372.5" width="112" height="21" rx="10.5" fill="none" stroke="#FF4A1C" stroke-opacity="0.55"/>
    <text x="1014" y="387" class="mono" font-size="9.5" letter-spacing="0.8" fill="#FF4A1C">± borrow --get</text>
  </g>

  <!-- ===== 05 report ===== -->
  <g class="card" style="animation-delay:.75s">
    <rect class="bezel cardout" x="344.5" y="470.5" width="299" height="95" rx="14" style="animation-delay:5.72s"/>
    <rect class="core" x="350" y="476" width="288" height="84" rx="10"/>
    <text x="366" y="500" class="mono idx">05</text>
    <text x="366" y="528" class="sans t">report every link</text>
    <text x="366" y="550" class="sans s">changes + [[name](url)] — one line per entry</text>
  </g>

  <!-- ===== 06 clean ===== -->
  <g class="card" style="animation-delay:.9s">
    <rect class="bezel cardout" x="744.5" y="478.5" width="239" height="79" rx="14" style="animation-delay:6.68s"/>
    <rect class="core" x="750" y="484" width="228" height="68" rx="10"/>
    <text x="766" y="506" class="mono idx">06</text>
    <text x="766" y="534" class="sans t">borrow --clean</text>
    <!-- clean-check: draws itself as the loop comet reaches 06, resets at loop end -->
    <path d="M936 504 l5 6 l10 -13" fill="none" stroke="#FF4A1C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.72;0.80;1" dur="8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
